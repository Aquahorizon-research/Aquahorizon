  document.querySelectorAll('.lb').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  $('q').placeholder=t('search');
  $('adm').textContent=canEdit?t('logout'):t('admin');
  fillSelects(); render();
}
document.querySelectorAll('.lb').forEach(b=>b.onclick=()=>setLang(b.dataset.l));

/* ---------- Rendering ---------- */
function card(a){
  const det=(a.summary||a.rec)?`<details><summary>${t('more')}</summary>${a.summary?`<p>${esc(a.summary).replace(/\n/g,'<br>')}</p>`:''}${a.rec?`<div class="rec"><b>${t('foruz')}:</b> ${esc(a.rec).replace(/\n/g,'<br>')}</div>`:''}</details>`:'';
  return `<article class="card"><div class="tags"><span class="tag">${esc(t('tp_'+a.topic))}</span><span class="tag">${esc(cname(a.country))}</span></div><h3>${esc(a.title)}</h3>
  <div class="meta">${esc(a.scientists)}${a.year?' · '+esc(a.year):''}</div>
  ${a.tool?`<div class="tool"><b>${t('tool')}:</b> ${esc(a.tool)}</div>`:''}${det}
  ${a.url&&/^https?:\/\//.test(a.url)?`<a href="${esc(a.url)}" target="_blank" rel="noopener">${t('source')} ↗</a>`:''}
  ${canEdit?`<button class="link" data-del="${esc(a.id)}">${t('del')}</button>`:''}</article>`;
}
function drawList(){
  const l=$('list'); if(!l)return;
  const q=$('q').value.trim().toLowerCase();
  const r=arts.filter(x=>(!topic||x.topic===topic)&&(!q||[x.title,x.scientists,x.tool,x.country,x.summary].join(' ').toLowerCase().includes(q)));
  l.innerHTML=r.length?r.map(card).join(''):`<div class="empty">${t('none')}</div>`;
}
function render(){
  const v=$('view'); let h='';
  $('f').classList.remove('open');
  if(view==='home'){
    const cs=new Set(arts.map(a=>a.country)),ss=new Set();
    arts.forEach(a=>(a.scientists||'').split(',').forEach(s=>{s=s.trim();if(s)ss.add(s)}));
    h=`<section class="hero"><p class="kick">${t('kick')}</p><h2>${t('htitle')}</h2><div class="stats"><div><b>${arts.length}</b>${t('s1')}</div><div><b>${cs.size}</b>${t('s2')}</div><div><b>${ss.size}</b>${t('s3')}</div></div></section><div class="topics">`+
    TOPICS.map(k=>`<button class="tc${topic===k?' on':''}" data-t="${k}"><b>${t('tp_'+k)}</b><span>${t('td_'+k)} · ${arts.filter(a=>a.topic===k).length}</span></button>`).join('')+
    `</div><div class="bar"><h2>${topic?t('tp_'+topic):t('latest')}</h2><input id="q" type="search" placeholder="${esc(t('search'))}" value="${esc(window._q||'')}"></div><div id="list" class="grid"></div>`;
  } else if(view==='europe'){
    const cnt={};arts.forEach(a=>cnt[a.country]=(cnt[a.country]||0)+1);
    h=`<h2>${t('eu_title')}</h2><p class="lead">${t('eu_lead')}</p><div class="chips">`+
    sorted().map(c=>`<button class="chip${country===c?' on':''}${cnt[c]?'':' z'}" data-c="${esc(c)}">${esc(cname(c))}${cnt[c]?' ('+cnt[c]+')':''}</button>`).join('')+`</div>`;
    if(country){const l=arts.filter(a=>a.country===country);
      h+=`<div class="bar"><h2>${esc(cname(country))}</h2>${canEdit?`<button class="btn" id="addb">${t('add_for')} ${esc(cname(country))}</button>`:''}</div><div class="grid">${l.length?l.map(card).join(''):`<div class="empty">${t('eu_none')}</div>`}</div>`;}
  } else {
    h=`<h2>${t('n3')}</h2><p class="lead"></p><div class="about">`+[1,2,3].map(i=>`<div class="card"><h3>${t('a'+i+'h')}</h3><p style="margin:0">${t('a'+i+'p')}</p></div>`).join('')+`</div>`;
  }
  v.innerHTML=h;
  const q=$('q'); if(q){q.oninput=()=>{window._q=q.value;drawList()};}
  drawList();
}
$('view').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  if(b.dataset.c){country=country===b.dataset.c?null:b.dataset.c;render();}
  if(b.dataset.t){topic=topic===b.dataset.t?null:b.dataset.t;render();}
  if(b.id==='addb'){$('f_country').value=country;$('f').classList.add('open');$('f').scrollIntoView();}
  if(b.dataset.del&&confirm(t('cdel'))){sb.from('articles').delete().eq('id',b.dataset.del).then(r=>{if(r.error)alert(r.error.message);else load();});}
});
document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>{
  document.querySelectorAll('nav a').forEach(x=>x.classList.remove('on'));a.classList.add('on');view=a.dataset.v;render();window.scrollTo(0,0);});
$('cancel').onclick=()=>$('f').classList.remove('open');

/* ---------- Supabase ---------- */
function load(){
  if(!sb)return;
  sb.from('articles').select('*').order('created_at',{ascending:false}).then(r=>{
    if(r.error)return; arts=r.data||[];
    const o=$('f').classList.contains('open'); render(); if(o&&canEdit)$('f').classList.add('open');
  });
}
$('f').onsubmit=e=>{
  e.preventDefault(); if(!sb)return;
  const d={title:$('f_title').value.trim(),country:$('f_country').value,topic:$('f_topic').value,scientists:$('f_sci').value.trim(),year:$('f_year').value.trim(),tool:$('f_tool').value.trim(),summary:$('f_sum').value.trim(),rec:$('f_rec').value.trim(),url:$('f_url').value.trim()};
  $('msg').textContent=t('saving');
  sb.from('articles').insert(d).then(r=>{
    if(r.error){$('msg').textContent=r.error.message;return;}
    $('msg').textContent='';$('f').reset();$('f').classList.remove('open');load();
  });
};
$('adm').onclick=e=>{e.preventDefault();if(canEdit){sb.auth.signOut();return;}$('lgf').classList.toggle('open');};
$('lgf').onsubmit=e=>{
  e.preventDefault();$('lgm').textContent='…';
  sb.auth.signInWithPassword({email:$('lg_e').value.trim(),password:$('lg_p').value}).then(r=>{
    if(r.error){$('lgm').textContent=r.error.message;return;}
    $('lgm').textContent='';$('lgf').classList.remove('open');$('lgf').reset();
  });
};
if(sb)sb.auth.onAuthStateChange((ev,ses)=>{canEdit=!!ses;$('adm').textContent=canEdit?t('logout'):t('admin');render();});

/* ---------- 3D intro ---------- */
(function(){
  const intro=$('intro'); let stop=false;
  const close=()=>{intro.style.opacity=0;setTimeout(()=>{intro.style.display='none';stop=true},900);try{sessionStorage.setItem('seen','1')}catch(e){}};
  $('enter').onclick=close;$('skip').onclick=close;
  try{if(sessionStorage.getItem('seen')){intro.style.display='none';return;}}catch(e){}
  setTimeout(()=>{const ps=document.querySelectorAll('#introText p');let i=0;
    (function n(){if(i<ps.length){ps[i++].classList.add('show');setTimeout(n,1500)}else $('enter').classList.add('show')})();},700);
  if(typeof THREE==='undefined')return;
  try{
    const r=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true}),sc=new THREE.Scene();
    sc.fog=new THREE.Fog(0x06131d,18,60);
    const cam=new THREE.PerspectiveCamera(55,1,.1,100);cam.position.set(0,7,16);
    const g=new THREE.PlaneGeometry(60,60,70,70);g.rotateX(-Math.PI/2);
    sc.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0x2e7ea6,wireframe:true,transparent:true,opacity:.55})));
    sc.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x9fd4ea,size:.09})));
    const dg=new THREE.SphereGeometry(.28,16,16),dm=new THREE.MeshBasicMaterial({color:0xbfe6f5,transparent:true,opacity:.8}),drops=[];
    for(let i=0;i<14;i++){const d=new THREE.Mesh(dg,dm);d.position.set((Math.random()-.5)*26,6+Math.random()*10,(Math.random()-.5)*20);d.userData.v=.03+Math.random()*.05;sc.add(d);drops.push(d);}
    let mx=0,my=0;addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
    const rs=()=>{r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()};rs();addEventListener('resize',rs);
    const p=g.attributes.position,t0=performance.now();
    (function loop(){if(stop)return;requestAnimationFrame(loop);const s=(performance.now()-t0)/1000;
      for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i);p.setY(i,Math.sin(x*.35+s*1.2)*.6+Math.cos(z*.4+s*.9)*.5+Math.sin((x+z)*.2+s*.6)*.4);}
      p.needsUpdate=true;
      drops.forEach(d=>{d.position.y-=d.userData.v;if(d.position.y<.5){d.position.y=12+Math.random()*4;d.position.x=(Math.random()-.5)*26}});
      cam.position.x+=(mx*8-cam.position.x)*.03;cam.position.y+=(7-my*3-cam.position.y)*.03;cam.lookAt(0,1.5,0);r.render(sc,cam);})();
  }catch(e){}
})();

setLang(L);
load();
</script>
</body>
</html>
